version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      mssql:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_HOST=mssql
      - DB_NAME=kazabuild_db
      - DB_PASS=YourStrong!Passw0rd123
      - RABBITMQ__HOST=rabbitmq
      - PORT=5000 
    networks:
      - backend_network
      - app_network

  mssql:
    build:
      context: ./mssql
      dockerfile: Dockerfile
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd123
    volumes:
      - railway_mssql_data:/var/opt/mssql
    networks:
      - backend_network

  frontend-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_BASE_URL=https://<YOUR-API-URL>.up.railway.app
    ports:
      - "80:80"
    networks:
      - app_network

networks:
  backend_network:
  app_network:

volumes:
  railway_mssql_data:
  railway_rabbitmq_data: