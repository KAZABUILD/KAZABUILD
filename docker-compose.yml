services:
    api:
        container_name: dotnet_api
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - "5000:5000"
        volumes:
            - ./backend:/app
        depends_on:
            mssql: 
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: http://+:80
            DB_HOST: mssql
            DB_NAME: kazabuild_db
            DB_PASS: YourStrong!Passw0rd123
            DB_SA_PASSWORD: YourStrong!Passw0rd123
            RABBITMQ__HOST: rabbitmq
            RABBITMQ__PORT: 5672
            RABBITMQ__USERNAME: guest
            RABBITMQ__PASSWORD: guest
            RABBITMQ__QUEUENAME: defaultQueue
            RABBITMQ__PREFETCHCOUNT: 1
        networks:
            - backend_network
            - app_network

    mssql:
        container_name: mssql_server
        #image: mcr.microsoft.com/mssql/server:2019-latest
        build:
            context: ./mssql
            dockerfile: Dockerfile
        platform: linux/amd64
        ports:
            - "1433:1433"
        environment:
            ACCEPT_EULA: "Y"
            SA_PASSWORD: "YourStrong!Passw0rd123"
            MSSQL_SA_PASSWORD: "YourStrong!Passw0rd123"
        healthcheck:
            test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1433' >/dev/null 2>&1 || exit 1"]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 120s
        volumes:
            - mssql-data:/var/opt/mssql
        networks:
            - backend_network

    rabbitmq:
        image: rabbitmq:3-management
        container_name: rabbitmq
        restart: always
        ports:
            - "5672:5672"   #RabbitMQ protocol
            - "15672:15672" #Management UI
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
        volumes:
            - rabbitmq-lib:/var/lib/rabbitmq/
            - rabbitmq-log:/var/log/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmqctl", "status"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - backend_network

    frontend-web:
        container_name: flutter_web
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                API_BASE_URL: http://api:80
        ports:
            - "3000:80"
        depends_on:
            - api
        networks:
            - app_network

    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        depends_on:
            - api
        networks:
            - backend_network

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        ports:
            - "3001:3000"
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
            - GF_USERS_ALLOW_SIGN_UP=false
        volumes:
            - grafana-data:/var/lib/grafana
            - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
            - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
            - ./grafana/dashboards:/var/lib/grafana/dashboards
        depends_on:
            - prometheus
        networks:
            - backend_network

networks:
    backend_network:
        driver: bridge
    app_network:
        driver: bridge

volumes:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local
  mssql-data:
    driver: local
  grafana-data:
    driver: local
